<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><title>Ratios: scale both parts</title><desc>2 : 3 → 4 : 6. Multiply both parts by the same factor. The total changes; the ratio stays equivalent.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#80151A"/></marker></defs><rect width="1080" height="1080" fill="#F7F2EC"/><text x="72" y="82" font-family="Noto Sans, sans-serif" font-size="22" fill="#80151A" text-anchor="start">AXOMRANK / CI-02 / EDITABLE EXPLANATION</text><text x="72" y="163" font-family="Noto Sans, sans-serif" font-size="50" fill="#292929" text-anchor="start">Ratios: scale both parts</text><text x="170" y="345" font-family="Noto Sans, sans-serif" font-size="34" fill="#292929" text-anchor="start">Original ratio</text><text x="170" y="590" font-family="Noto Sans, sans-serif" font-size="34" fill="#292929" text-anchor="start">Scale both groups by 2</text><circle cx="140" cy="430" r="27" fill="#80151A"/><circle cx="223" cy="430" r="27" fill="#80151A"/><circle cx="306" cy="430" r="27" fill="#3F6B4F"/><circle cx="389" cy="430" r="27" fill="#3F6B4F"/><circle cx="472" cy="430" r="27" fill="#3F6B4F"/><text x="140" y="490" font-family="Noto Sans, sans-serif" font-size="30" fill="#292929" text-anchor="start">Maroon 2 : Green 3</text><circle cx="140" cy="675" r="27" fill="#80151A"/><circle cx="223" cy="675" r="27" fill="#80151A"/><circle cx="306" cy="675" r="27" fill="#80151A"/><circle cx="389" cy="675" r="27" fill="#80151A"/><circle cx="472" cy="675" r="27" fill="#3F6B4F"/><circle cx="555" cy="675" r="27" fill="#3F6B4F"/><circle cx="638" cy="675" r="27" fill="#3F6B4F"/><circle cx="721" cy="675" r="27" fill="#3F6B4F"/><circle cx="804" cy="675" r="27" fill="#3F6B4F"/><circle cx="887" cy="675" r="27" fill="#3F6B4F"/><text x="140" y="735" font-family="Noto Sans, sans-serif" font-size="30" fill="#292929" text-anchor="start">Maroon 4 : Green 6</text><text x="72" y="860" font-family="Noto Sans, sans-serif" font-size="30" fill="#80151A" text-anchor="start">2 : 3 → 4 : 6</text><text x="72" y="918" font-family="Noto Sans, sans-serif" font-size="27" fill="#292929" text-anchor="start">Multiply both parts by the same factor. The total</text><text x="72" y="954" font-family="Noto Sans, sans-serif" font-size="27" fill="#292929" text-anchor="start">changes; the ratio stays equivalent.</text><text x="72" y="1035" font-family="Noto Sans, sans-serif" font-size="20" fill="#292929" text-anchor="start">Diagram is authoritative. Pair with illustration; translate as editable text.</text></svg>