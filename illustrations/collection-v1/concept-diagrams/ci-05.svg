<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><title>Science: the water cycle</title><desc>Evaporate → condense → rain → collect. Water vapour is invisible; clouds are droplets or ice. This is a simplified cycle, with other paths omitted.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#80151A"/></marker></defs><rect width="1080" height="1080" fill="#F7F2EC"/><text x="72" y="82" font-family="Noto Sans, sans-serif" font-size="22" fill="#80151A" text-anchor="start">AXOMRANK / CI-05 / EDITABLE EXPLANATION</text><text x="72" y="163" font-family="Noto Sans, sans-serif" font-size="50" fill="#292929" text-anchor="start">Science: the water cycle</text><rect x="95" y="310" width="380" height="120" rx="18" fill="#F7F2EC" stroke="#292929" stroke-width="3"/><text x="285" y="385" font-family="Noto Sans, sans-serif" font-size="34" fill="#80151A" text-anchor="middle">Evaporation</text><rect x="600" y="310" width="380" height="120" rx="18" fill="#F7F2EC" stroke="#292929" stroke-width="3"/><text x="790" y="385" font-family="Noto Sans, sans-serif" font-size="34" fill="#80151A" text-anchor="middle">Condensation</text><rect x="600" y="620" width="380" height="120" rx="18" fill="#F7F2EC" stroke="#292929" stroke-width="3"/><text x="790" y="695" font-family="Noto Sans, sans-serif" font-size="34" fill="#80151A" text-anchor="middle">Precipitation</text><rect x="95" y="620" width="380" height="120" rx="18" fill="#F7F2EC" stroke="#292929" stroke-width="3"/><text x="285" y="695" font-family="Noto Sans, sans-serif" font-size="34" fill="#80151A" text-anchor="middle">Collection</text><path d="M485,370 L585,370" fill="none" stroke="#80151A" stroke-width="6" marker-end="url(#arrow)"/><path d="M790,445 L790,600" fill="none" stroke="#80151A" stroke-width="6" marker-end="url(#arrow)"/><path d="M585,680 L485,680" fill="none" stroke="#80151A" stroke-width="6" marker-end="url(#arrow)"/><path d="M285,605 L285,445" fill="none" stroke="#80151A" stroke-width="6" marker-end="url(#arrow)"/><text x="540" y="550" font-family="Noto Sans, sans-serif" font-size="30" fill="#292929" text-anchor="middle">Energy from the Sun</text><text x="72" y="860" font-family="Noto Sans, sans-serif" font-size="30" fill="#80151A" text-anchor="start">Evaporate → condense → rain → collect</text><text x="72" y="918" font-family="Noto Sans, sans-serif" font-size="27" fill="#292929" text-anchor="start">Water vapour is invisible; clouds are droplets or ice.</text><text x="72" y="954" font-family="Noto Sans, sans-serif" font-size="27" fill="#292929" text-anchor="start">This is a simplified cycle, with other paths omitted.</text><text x="72" y="1035" font-family="Noto Sans, sans-serif" font-size="20" fill="#292929" text-anchor="start">Diagram is authoritative. Pair with illustration; translate as editable text.</text></svg>