<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><title>Computing: binary place values</title><desc>1010 in base 2 = 8 + 2 = 10 in base 10. From right to left, place values double: 1, 2, 4, 8. Add only the places whose digit is 1.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#80151A"/></marker></defs><rect width="1080" height="1080" fill="#F7F2EC"/><text x="72" y="82" font-family="Noto Sans, sans-serif" font-size="22" fill="#80151A" text-anchor="start">AXOMRANK / CI-08 / EDITABLE EXPLANATION</text><text x="72" y="163" font-family="Noto Sans, sans-serif" font-size="50" fill="#292929" text-anchor="start">Computing: binary place values</text><text x="190" y="345" font-family="Noto Sans, sans-serif" font-size="44" fill="#292929" text-anchor="middle">8</text><rect x="100" y="400" width="180" height="155" rx="18" fill="#80151A" stroke="#292929" stroke-width="3"/><text x="190" y="502" font-family="Noto Sans, sans-serif" font-size="64" fill="#FFFFFF" text-anchor="middle">1</text><text x="190" y="640" font-family="Noto Sans, sans-serif" font-size="32" fill="#292929" text-anchor="middle">1 × 8</text><text x="430" y="345" font-family="Noto Sans, sans-serif" font-size="44" fill="#292929" text-anchor="middle">4</text><rect x="340" y="400" width="180" height="155" rx="18" fill="#F7F2EC" stroke="#292929" stroke-width="3"/><text x="430" y="502" font-family="Noto Sans, sans-serif" font-size="64" fill="#292929" text-anchor="middle">0</text><text x="430" y="640" font-family="Noto Sans, sans-serif" font-size="32" fill="#292929" text-anchor="middle">0 × 4</text><text x="670" y="345" font-family="Noto Sans, sans-serif" font-size="44" fill="#292929" text-anchor="middle">2</text><rect x="580" y="400" width="180" height="155" rx="18" fill="#80151A" stroke="#292929" stroke-width="3"/><text x="670" y="502" font-family="Noto Sans, sans-serif" font-size="64" fill="#FFFFFF" text-anchor="middle">1</text><text x="670" y="640" font-family="Noto Sans, sans-serif" font-size="32" fill="#292929" text-anchor="middle">1 × 2</text><text x="910" y="345" font-family="Noto Sans, sans-serif" font-size="44" fill="#292929" text-anchor="middle">1</text><rect x="820" y="400" width="180" height="155" rx="18" fill="#F7F2EC" stroke="#292929" stroke-width="3"/><text x="910" y="502" font-family="Noto Sans, sans-serif" font-size="64" fill="#292929" text-anchor="middle">0</text><text x="910" y="640" font-family="Noto Sans, sans-serif" font-size="32" fill="#292929" text-anchor="middle">0 × 1</text><text x="72" y="860" font-family="Noto Sans, sans-serif" font-size="30" fill="#80151A" text-anchor="start">1010 in base 2 = 8 + 2 = 10 in base 10</text><text x="72" y="918" font-family="Noto Sans, sans-serif" font-size="27" fill="#292929" text-anchor="start">From right to left, place values double: 1, 2, 4, 8. Add</text><text x="72" y="954" font-family="Noto Sans, sans-serif" font-size="27" fill="#292929" text-anchor="start">only the places whose digit is 1.</text><text x="72" y="1035" font-family="Noto Sans, sans-serif" font-size="20" fill="#292929" text-anchor="start">Diagram is authoritative. Pair with illustration; translate as editable text.</text></svg>