<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><title>Reasoning: find the rule</title><desc>2, 4, 6, 8, 10 — add 2. Compare neighbouring terms. Here every difference is 2; apply the same rule to continue.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#80151A"/></marker></defs><rect width="1080" height="1080" fill="#F7F2EC"/><text x="72" y="82" font-family="Noto Sans, sans-serif" font-size="22" fill="#80151A" text-anchor="start">AXOMRANK / CI-03 / EDITABLE EXPLANATION</text><text x="72" y="163" font-family="Noto Sans, sans-serif" font-size="50" fill="#292929" text-anchor="start">Reasoning: find the rule</text><rect x="80" y="420" width="155" height="155" rx="18" fill="#F7F2EC" stroke="#292929" stroke-width="3"/><text x="157" y="518" font-family="Noto Sans, sans-serif" font-size="60" fill="#80151A" text-anchor="middle">2</text><text x="254" y="385" font-family="Noto Sans, sans-serif" font-size="28" fill="#80151A" text-anchor="middle">+2</text><path d="M225,405 L290,405" fill="none" stroke="#80151A" stroke-width="6" marker-end="url(#arrow)"/><rect x="270" y="420" width="155" height="155" rx="18" fill="#F7F2EC" stroke="#292929" stroke-width="3"/><text x="347" y="518" font-family="Noto Sans, sans-serif" font-size="60" fill="#80151A" text-anchor="middle">4</text><text x="444" y="385" font-family="Noto Sans, sans-serif" font-size="28" fill="#80151A" text-anchor="middle">+2</text><path d="M415,405 L480,405" fill="none" stroke="#80151A" stroke-width="6" marker-end="url(#arrow)"/><rect x="460" y="420" width="155" height="155" rx="18" fill="#F7F2EC" stroke="#292929" stroke-width="3"/><text x="537" y="518" font-family="Noto Sans, sans-serif" font-size="60" fill="#80151A" text-anchor="middle">6</text><text x="634" y="385" font-family="Noto Sans, sans-serif" font-size="28" fill="#80151A" text-anchor="middle">+2</text><path d="M605,405 L670,405" fill="no