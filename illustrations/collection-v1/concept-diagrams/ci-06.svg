<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><title>Science: a closed circuit</title><desc>Closed path → current can flow. Opening the switch breaks the path. This schematic is conceptual; use supervised low-voltage kits only.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#80151A"/></marker></defs><rect width="1080" height="1080" fill="#F7F2EC"/><text x="72" y="82" font-family="Noto Sans, sans-serif" font-size="22" fill="#80151A" text-anchor="start">AXOMRANK / CI-06 / EDITABLE EXPLANATION</text><text x="72" y="163" font-family="Noto Sans, sans-serif" font-size="50" fill="#292929" text-anchor="start">Science: a closed circuit</text><path d="M200,400 H450 M560,400 H880 V502 M880,598 V710 H200 V570 M200,510 V400" fill="none" stroke="#292929" stroke-width="7"/><path d="M450,400 L560,400" fill="none" stroke="#80151A" stroke-width="6"/><circle cx="450" cy="400" r="9" fill="#80151A"/><circle cx="560" cy="400" r="9" fill="#80151A"/><path d="M165,510 L235,510" fill="none" stroke="#80151A" stroke-width="6"/><path d="M180,570 L220,570" fill="none" stroke="#80151A" stroke-width="6"/><circle cx="880" cy="550" r="48" fill="#F7F2EC" stroke="#292929" stroke-width="6"/><path d="M850,520 L910,580" fill="none" stroke="#80151A" stroke-width="6"/><path d="M850,580 L910,520" fill="none" stroke="#80151A" stroke-width="6"/><text x="505" y="350" font-family="Noto Sans, sans-serif" font-size="30" fill="#292929" text-anchor="middle">Closed switch</text><text x="110" y="615" font-family="Noto Sans, sans-serif" font-size="30" fill="#292929" text-anchor="start">Cell</text><text x="790" y="640" font-family="Noto Sans, sans-serif" font-size="30" fill="#292929" text-anchor="start">Lamp</text><text x="540" y="780" font-family="Noto Sans, sans-serif" font-size="34" fill="#80151A" text-anchor="middle">Complete path</text><text x="72" y="860" font-family="Noto Sans, sans-serif" font-size="30" fill="#80151A" text-anchor="start">Closed path → current can flow</text><text x="72" y="918" font-family="Noto Sans, sans-serif" font-size="27" fill="#292929" text-anchor="start">Opening the switch breaks the path. This schematic is</text><text x="72" y="954" font-family="Noto Sans, sans-serif" font-size="27" fill="#292929" text-anchor="start">conceptual; use supervised low-voltage kits only.</text><text x="72" y="1035" font-family="Noto Sans, sans-serif" font-size="20" fill="#292929" text-anchor="start">Diagram is authoritative. Pair with illustration; translate as editable text.</text></svg>