<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><title>Computing: input to output</title><desc>Input → process → output. A keyboard supplies input. The computer processes it; the screen presents the result.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#80151A"/></marker></defs><rect width="1080" height="1080" fill="#F7F2EC"/><text x="72" y="82" font-family="Noto Sans, sans-serif" font-size="22" fill="#80151A" text-anchor="start">AXOMRANK / CI-07 / EDITABLE EXPLANATION</text><text x="72" y="163" font-family="Noto Sans, sans-serif" font-size="50" fill="#292929" text-anchor="start">Computing: input to output</text><rect x="72" y="410" width="260" height="240" rx="18" fill="#F7F2EC" stroke="#292929" stroke-width="3"/><text x="202" y="485" font-family="Noto Sans, sans-serif" font-size="40" fill="#80151A" text-anchor="middle">Input</text><text x="202" y="560" font-family="Noto Sans, sans-serif" font-size="32" fill="#292929" text-anchor="middle">Keyboard</text><rect x="402" y="410" width="260" height="240" rx="18" fill="#F7F2EC" stroke="#292929" stroke-width="3"/><text x="532" y="485" font-family="Noto Sans, sans-serif" font-size="40" fill="#80151A" text-anchor="middle">Process</text><text x="532" y="560" font-family="Noto Sans, sans-serif" font-size="32" fill="#292929" text-anchor="middle">Computer</text><rect x="732" y="410" width="260" height="240" rx="18" fill="#F7F2EC" stroke="#292929" stroke-width="3"/><text x="862" y="485" font-family="Noto Sans, sans-serif" font-size="40" fill="#80151A" text-anchor="middle">Output</text><text x="862" y="560" font-family="Noto Sans, sans-serif" font-size="32" fill="#292929" text-anchor="middle">Screen</text><path d="M346,530 L390,530" fill="none" stroke="#80151A" stroke-width="6" marker-end="url(#arrow)"/><path d="M676,530 L720,530" fill="none" stroke="#80151A" stroke-width="6" marker-end="url(#arrow)"/><text x="72" y="860" font-family="Noto Sans, sans-serif" font-size="30" fill="#80151A" text-anchor="start">Input → process → output</text><text x="72" y="918" font-family="Noto Sans, sans-serif" font-size="27" fill="#292929" text-anchor="start">A keyboard supplies input. The computer processes it; the</text><text x="72" y="954" font-family="Noto Sans, sans-serif" font-size="27" fill="#292929" text-anchor="start">screen presents the result.</text><text x="72" y="1035" font-family="Noto Sans, sans-serif" font-size="20" fill="#292929" text-anchor="start">Diagram is authoritative. Pair with illustration; translate as editable text.</text></svg>